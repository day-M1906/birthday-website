<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday!</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- COUNTDOWN & SPLIT-SCREEN ANIMATION OVERLAY -->
  <div id="intro-overlay">
    <div id="countdown">5</div>
    
    <div id="animation-container" class="hidden">
      <!-- Left half: text -->
      <div class="intro-left">
        <h1 class="prep-text">Hi Childuuuu...</h1>
      </div>
      <!-- Right half: Your downloaded GIF (ensure file named correctly) -->
      <div class="intro-right">
        <img src="panda-heart.gif" alt="Cute Panda Heart" id="intro-panda">
      </div>
    </div>
  </div>

  <!-- MAIN WEBSITE CONTENT -->
  <div id="main-website" class="hidden">
    <!-- PAGE 1: Cute Panda & Tricky Buttons -->
    <section id="page-1" class="page active">
      <div class="card">
        <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3p0eGN1YmE2Mm9kZm02a3MyeTFzcGkyeWZ5dzBwaWZvZjhlaHN2biZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/EatwJZRUIv41G/giphy.gif" alt="Cute Panda" class="panda-img">
        <h2>Are you ready for your birthday surprise? 🐼</h2>
        <div class="btn-group">
          <button id="yes-btn">Yes! 💕</button>
          <button id="no-btn">No 😜</button>
        </div>
      </div>
    </section>

    <!-- PAGE 2: Animated Photo Gallery -->
    <section id="page-2" class="page">
      <h2>Cute Memories ✨</h2>
      <div class="gallery">
        <div class="photo-card" style="--order: 1;"><img src="photo1.jpeg" alt="Memory 1"></div>
        <div class="photo-card" style="--order: 2;"><img src="photo2.jpeg" alt="Memory 2"></div>
        <div class="photo-card" style="--order: 3;"><img src="photo3.jpeg" alt="Memory 3"></div>
        <div class="photo-card" style="--order: 4;"><img src="photo4.jpeg" alt="Memory 4"></div>
      </div>
      <button id="next-page-btn" class="nav-btn">Read My Wish 💌</button>
    </section>

    <!-- PAGE 3: Custom Birthday Message with Photo -->
    <section id="page-3" class="page">
      <div class="card wish-card">
        <h1>🎂Happy Birthday Ma...🫶</h1>
        
        <!-- NEW: Add a main photo to the last page (replace 'final-photo.jpg' with your filename) -->
        <div class="final-photo-container">
            <img src="final-photo.jpeg" alt="Birthday Person" class="final-birthday-photo">
        </div>

        <p class="custom-wish">
          I know sometimes i irritate you, sometimes I hurt you, sometimes I overreact also. But that's all because I love you ❤️ so much and I feel comfortable with you 🥰
        </p>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
